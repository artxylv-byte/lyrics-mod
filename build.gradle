plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional: adds a "Configure" button in Mod Menu. Not required at runtime.
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Client game test: launches Minecraft, plays the built-in demo song and saves screenshots of each
// display mode to run/clientGameTest/screenshots. Run with: ./gradlew runClientGameTest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'artlyrics-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

sourceSets {
    main {
        java.srcDir "src/compat/${project.compat}/java"
    }
}

processResources {
    def props = [
        version             : project.version,
        minecraft_dependency: project.minecraft_dependency,
        java_version        : project.java_version,
        loader_version      : project.loader_version,
        mixins              : project.findProperty('mixins') ?: '[]',
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    useJUnitPlatform()
    // Opt-in tests that call the real LRCLIB API: ./gradlew test -Dartlyrics.liveTests=true
    systemProperty 'artlyrics.liveTests', System.getProperty('artlyrics.liveTests', 'false')
    // Opt-in: render the settings UI to build/ui-preview/*.png: ./gradlew test -Dartlyrics.uiPreview=true
    systemProperty 'artlyrics.uiPreview', System.getProperty('artlyrics.uiPreview', 'false')
    systemProperty 'java.awt.headless', 'true'
    testLogging { showStandardStreams = true }
}
